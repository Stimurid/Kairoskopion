name: TRM071 PnT corpus preflight

on:
  push:
    branches:
      - ops/trm071-pnt-corpus-preflight-20261009

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - name: Probe ten accepted PnT fulltext locators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from kairoskopion.adapters.venue.fulltext_fetch import acquire_explicit_fulltext
          from kairoskopion.adapters.source_intake import SourceRole, register_local_source

          dois = [
              "10.1007/s13347-026-01071-y",
              "10.1007/s13347-026-01046-z",
              "10.1007/s13347-026-01085-6",
              "10.1007/s13347-026-01134-0",
              "10.1007/s13347-026-01105-5",
              "10.1007/s13347-025-00949-7",
              "10.1007/s13347-025-00889-2",
              "10.1007/s13347-025-00843-2",
              "10.1007/s13347-025-00962-w",
              "10.1007/s13347-026-01108-2",
          ]

          def inspect(url, root, source_id):
              result = acquire_explicit_fulltext(url, output_dir=root)
              row = {
                  "url": url,
                  "fetch_status": result.get("status"),
                  "content_type": result.get("content_type"),
                  "transport_sha256": result.get("sha256"),
                  "size_bytes": result.get("size_bytes"),
                  "error": result.get("error"),
              }
              path = result.get("path")
              if path:
                  snapshot, text = register_local_source(
                      Path(path),
                      role=SourceRole.PUBLISHED_ARTICLE,
                      source_id=source_id,
                  )
                  chars = len(text or "")
                  row.update({
                      "extraction_status": snapshot.extraction_status,
                      "content_hash": snapshot.content_hash,
                      "text_chars": chars,
                      "substantive_body": (
                          snapshot.extraction_status == "extracted"
                          and chars >= 5000
                          and chars <= 80000
                      ),
                      "extraction_errors": snapshot.extraction_errors or [],
                  })
              return row

          rows = []
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              for doi in dois:
                  landing = inspect(
                      f"https://link.springer.com/article/{doi}",
                      root,
                      f"doi:{doi}:landing",
                  )
                  pdf = inspect(
                      f"https://link.springer.com/content/pdf/{doi}.pdf",
                      root,
                      f"doi:{doi}:pdf",
                  )
                  candidates = [r for r in (pdf, landing) if r.get("substantive_body")]
                  chosen = max(candidates, key=lambda x: x.get("text_chars") or 0) if candidates else None
                  rows.append({
                      "doi": doi,
                      "landing": landing,
                      "pdf": pdf,
                      "selected": chosen,
                  })

          selected = [r["selected"] for r in rows if r.get("selected")]
          hashes = [r.get("content_hash") for r in selected if r.get("content_hash")]
          summary = {
              "schema_version": "trm071-pnt-corpus-preflight-v2",
              "requested": len(rows),
              "substantive_bodies": len(selected),
              "unique_content_hashes": len(set(hashes)),
              "duplicate_hashes": len(hashes) - len(set(hashes)),
              "rows": rows,
          }
          out = Path("/tmp/trm071-pnt-preflight")
          out.mkdir(parents=True, exist_ok=True)
          (out / "receipt.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              k: summary[k]
              for k in ("requested", "substantive_bodies", "unique_content_hashes", "duplicate_hashes")
          }))
          if summary["substantive_bodies"] < 8:
              raise SystemExit("fewer than seed-profile minimum 8 substantive bodies")
          if summary["unique_content_hashes"] < 8:
              raise SystemExit("fewer than seed-profile minimum 8 unique bodies")
          PY

      - name: Upload metadata-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trm071-pnt-corpus-preflight
          path: /tmp/trm071-pnt-preflight/receipt.json
          if-no-files-found: warn
          retention-days: 30
